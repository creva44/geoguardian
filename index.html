        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

<script>
window.addEventListener('load', function() {
        setTimeout(function() {
            // 1. Pulsante e Pannello Trasparenza Vettori (in basso a destra)
            var toggleBtn = document.createElement('div');
            toggleBtn.innerHTML = '⚙️ Trasparenza Vettori';
            toggleBtn.style.cssText = 'position: absolute; bottom: 30px; right: 10px; z-index: 1000; background: #ffffff; padding: 6px 14px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; color: #333; user-select: none;';
            
            var panel = document.createElement('div');
            panel.id = 'opacity-panel';
            panel.style.cssText = 'position: absolute; bottom: 75px; right: 10px; z-index: 1000; width: 280px; max-height: 400px; overflow-y: auto; background: #ffffff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-family: sans-serif; display: none; padding: 10px;';
            panel.innerHTML = '<div style="font-size: 12px; font-weight: bold; color: #444; margin-bottom: 8px; border-bottom: 1px solid #eee; padding-bottom: 4px; display: flex; justify-content: space-between;"><span>Regolazione Trasparenza</span><span id="close-panel" style="cursor: pointer; color: #999;">✕</span></div><div id="layer-sliders-list"></div>';

            document.body.appendChild(toggleBtn);
            document.body.appendChild(panel);

            toggleBtn.onclick = function() {
                panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
            };

            document.getElementById('close-panel').onclick = function() {
                panel.style.display = 'none';
            };

          var container = document.getElementById('layer-sliders-list');
            if (container) {
                container.innerHTML = '';
                for (var key in window) {
                    if ((key.startsWith('json_') || key.startsWith('layer_') || key.startsWith('lyr_')) && window[key]) {
                        var layerObj = window[key];
                        
                        if (typeof layerObj.setStyle === 'function' || typeof layerObj.setOpacity === 'function') {
                            var rawName = key.replace(/^(json_|layer_|lyr_)/, '').replace(/_\d+$/, '').replace(/_/g, ' ').trim();
                            var cleanCheck = rawName.toLowerCase();

                            if (cleanCheck.includes('ombreggiatura') || cleanCheck.includes('dtm') || cleanCheck.includes('raster')) {
                                continue;
                            }

                            var formattedName = rawName
                                .replace(/([a-z])([A-Z])/g, '$1 $2')
                                .toLowerCase()
                                .replace(/^\w/, c => c.toUpperCase());

                            var sliderId = 'slider-' + key;
                            if (document.getElementById(sliderId)) continue;

                            var div = document.createElement('div');
                            div.style.marginBottom = '10px';
                            div.innerHTML = `
                                <div style="font-size: 11px; color: #333; margin-bottom: 2px; display: flex; justify-content: space-between;">
                                    <strong>${formattedName}</strong>
                                    <span id="val-${sliderId}" style="color: #666;">60%</span>
                                
                                <input type="range" id="${sliderId}" min="0" max="1" step="0.05" value="0.6" style="width: 100%; cursor: pointer;">
                            `;
                            container.appendChild(div);

                            (function(layer, sId) {
                                document.getElementById(sId).addEventListener('input', function(e) {
                                    var opacityVal = parseFloat(e.target.value);
                                    document.getElementById('val-' + sId).innerText = Math.round(opacityVal * 100) + '%';
                                    
                                    if (typeof layer.setStyle === 'function') {
                                        layer.setStyle(function(feature) {
                                            return {
                                                fillOpacity: opacityVal * 0.7,
                                                opacity: opacityVal
                                            };
                                        });
                                    } else if (typeof layer.setOpacity === 'function') {
                                        layer.setOpacity(opacityVal);
                                    }
                                });
                            })(layerObj, sliderId);
                        }
                    }
                }
            }
            // 2. Pulsante Navigazione Google Maps (in basso a sinistra)
            var navBtn = document.createElement('a');
            navBtn.href = 'https://www.google.com/maps/dir/?api=1&destination=Sternatia,+Lecce,+Italy';
            navBtn.target = '_blank';
            navBtn.innerHTML = '🚗 Naviga verso Sternatia';
            navBtn.style.cssText = 'position: absolute; bottom: 30px; left: 10px; z-index: 1000; background: #ffffff; padding: 6px 14px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; color: #1a73e8; text-decoration: none; user-select: none; display: flex; align-items: center; gap: 5px;';
            document.body.appendChild(navBtn);
			// 3. Pulsante GPS sulla Mappa (in basso a destra)
            var gpsBtn = document.createElement('div');
            gpsBtn.innerHTML = '📍 Mia Posizione';
            gpsBtn.style.cssText = 'position: absolute; bottom: 120px; right: 10px; z-index: 1000; background: #ffffff; padding: 6px 14px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; color: #007bff; user-select: none;';
            gpsBtn.onclick = function() {
                localizzaGPS();
            };
            document.body.appendChild(gpsBtn);

        }, 800);
    });
    </script>

    <!-- Script GeoGuardian: Registrazione Service Worker & GPS -->
    <script>
      // 1. REGISTRAZIONE SERVICE WORKER PER PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('GeoGuardian PWA Attiva! Scope:', reg.scope))
            .catch(err => console.error('Errore PWA:', err));
        });
      }

      // 2. FUNZIONE GPS IN TEMPO REALE PER SOPRALLUOGHI
      let userMarker = null;
      let accuracyCircle = null;

      function localizzaGPS() {
        if (!navigator.geolocation) {
          alert("Il tuo dispositivo non supporta la geolocalizzazione GPS.");
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;

            if (userMarker) {
              userMarker.setLatLng([lat, lng]);
              accuracyCircle.setLatLng([lat, lng]).setRadius(accuracy);
            } else {
              userMarker = L.circleMarker([lat, lng], {
                radius: 9,
                fillColor: '#007bff',
                color: '#ffffff',
                weight: 3,
                opacity: 1,
                fillOpacity: 0.9
              }).addTo(map).bindPopup(`<b>Sei qui</b><br>Accuratezza GPS: ±${Math.round(accuracy)} metri`);

              accuracyCircle = L.circle([lat, lng], {
                radius: accuracy,
                color: '#007bff',
                fillColor: '#007bff',
                fillOpacity: 0.15,
                weight: 1
              }).addTo(map);
            }

            map.setView([lat, lng], 17);
          },
          (error) => {
            alert("Impossibile rilevare la posizione GPS. Assicurati di aver attivato la localizzazione sul telefono.");
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      }
    </script>
